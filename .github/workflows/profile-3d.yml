name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # Runs daily at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
  # Runs once when this workflow file changes, so the graph is generated right away
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and Push Generated Assets
        run: |
          git config user.name "DEZ-byte"
          git config user.email "DEZ-byte@users.noreply.github.com"
          git add -A .
          if git commit -m "chore: regenerate 3d contribution graph [skip ci]" --no-trailer; then
            git pull --rebase origin main
            git push
          else
            echo "No changes in contribution graph detected."
          fi
